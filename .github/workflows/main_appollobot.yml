# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - AppolloBot

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ApolloBreakdowns/ClientApp/package-lock.json

      - name: Build with dotnet
        run: dotnet build ApolloBreakdowns.slnx --configuration Release

      - name: Verify application rules
        run: dotnet run --project tests/ApolloBreakdowns.Tests --configuration Release --no-build

      - name: Verify form logic
        working-directory: src/ApolloBreakdowns/ClientApp
        run: npm test

      - name: dotnet publish
        run: dotnet publish src/ApolloBreakdowns/ApolloBreakdowns.csproj --configuration Release --no-build --no-restore --output "${{ github.workspace }}/publish"

      - name: Verify deployment package
        shell: bash
        run: |
          test -f publish/ApolloBreakdowns.dll
          test -f publish/ApolloBreakdowns.runtimeconfig.json
          test -f publish/wwwroot/miniapp/index.html
          test ! -f publish/ApolloBreakdowns.Tests.runtimeconfig.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E72949824DA543C9AA4D42D49D70C5A0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0310559B7DEC4582BAD73464ED8729A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_47897744258747389010F31313828D2C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AppolloBot'
          slot-name: 'Production'
          package: publish
          startup-command: 'dotnet ApolloBreakdowns.dll'

      - name: Verify running application
        shell: bash
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "${APP_URL%/}/health" --output /tmp/apollo-health.json &&
               jq --exit-status '.status == "healthy"' /tmp/apollo-health.json; then
              echo "APOLLO application is running."
              cat /tmp/apollo-health.json
              exit 0
            fi
            echo "Waiting for APOLLO startup ($attempt/18)..."
            sleep 10
          done
          echo "The package was deployed, but /health did not confirm application startup. Check App Service Log stream."
          exit 1
